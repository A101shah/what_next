name: Build verified intelligence and publish WhatNext AI

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ML dependencies
        run: pip install -r requirements.txt
      - name: Cache public OECD survey files
        uses: actions/cache@v4
        with:
          path: .cache/piaac
          key: piaac-cycle2-oct2026-public-use-v1
      - name: Build OECD PIAAC real-worker evidence
        run: python scripts/build_careers.py
      - name: Reproduce the 47-column anonymous career dataset
        run: python -m scripts.export_merged_people
      - name: Aggregate workplace skill-use evidence
        run: python -m scripts.build_skill_evidence
      - name: Build O*NET occupational ML dataset
        run: python scripts/build_data.py
      - name: Fetch real recent research
        run: python scripts/update_news.py
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Run focused unit tests
        run: python -m unittest discover -s tests -v
      - name: Check generated files
        run: |
          python -m compileall -q scripts
          python -m json.tool data/careers.json > /dev/null
          python -m json.tool data/skill_evidence.json > /dev/null
          python -m json.tool data/model.json > /dev/null
          python -m json.tool data/research.json > /dev/null
          python -m json.tool data/paths.json > /dev/null
          test -s data/model.json
          python -c 'import json; d=json.load(open("data/careers.json")); assert len(d["countries"]) >= 2; assert all(g["n"]>=25 for c in d["countries"].values() for g in c["groups"].values())'
          python -c 'import json; d=json.load(open("data/skill_evidence.json")); assert len(d["countries"]) >= 2; assert sum(map(len,d["countries"].values())) >= 10; assert all(g["n"]>=25 for c in d["countries"].values() for g in c.values())'
          test -s out/WhatNext_Career_Intelligence_Combined.csv
      # Vercel deploys from Git, while Pages deploys from this job's artifact.
      # Commit only the verified, aggregated JSON so both hosts serve identical data.
      # GitHub Actions token pushes do not recursively trigger another Actions run.
      - name: Sync verified static data for Vercel
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/model.json data/careers.json data/skill_evidence.json data/research.json
          if ! git diff --cached --quiet; then
            git commit -m "data: publish verified career and research snapshots [skip ci]"
            git push origin HEAD:main
          else
            echo "Snapshots already up to date"
          fi
      - name: Stage only public app assets
        run: |
          mkdir -p site/data
          cp index.html styles.css app.js site/
          cp data/paths.json data/model.json data/research.json data/careers.json data/skill_evidence.json site/data/
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
