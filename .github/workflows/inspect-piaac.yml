name: Inspect official PIAAC dataset schema
on:
  push:
    paths: ['scripts/probe_piaac.py','.github/workflows/inspect-piaac.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - run: python scripts/probe_piaac.py
